events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # -------------------------------------------------------
    # Upstream — backend Spring Boot (solo accesible en la
    # red interna tallerdae-net, sin puerto publicado al host)
    # -------------------------------------------------------
    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # -------------------------------------------------
        # Proxy hacia el backend para todas las rutas /api/
        # Se preserva el prefijo /api/ que Spring Boot espera
        # -------------------------------------------------
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------------
        # Archivos estáticos del frontend (cotizador-frontend)
        # -------------------------------------------------
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # -------------------------------------------------
        # Páginas de error
        # -------------------------------------------------
        error_page 500 502 503 504 /index.html;
    }
}
