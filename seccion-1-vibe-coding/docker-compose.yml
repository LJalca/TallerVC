services:

  # ============================================================
  # MySQL 8
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: tallerdae-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Puerto expuesto solo dentro de la red interna (tallerdae-net).
    # No se publica en el host intencionalmente.
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tallerdae-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Nginx — servidor estático + proxy listo para backend
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: tallerdae-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - tallerdae-net
    depends_on:
      mysql:
        condition: service_healthy

# ============================================================
# Volúmenes y redes
# ============================================================
volumes:
  mysql_data:
    driver: local

networks:
  tallerdae-net:
    driver: bridge
